name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://xsjwmqmdbrfpkhpnodsu.supabase.co/rest/v1/vacancies?select=id&limit=1" \
            -H "apikey: sb_publishable_PPogPICjnAHv5dz-_G-MDw_sRzgGhUe")
          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
